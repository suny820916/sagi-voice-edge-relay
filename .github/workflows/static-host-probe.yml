name: Probe Independent Static Beta Hosts
on:
  push:
    branches: [feature/v1.5-github-pages-beta]
    paths: [".github/workflows/static-host-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public static mirrors
        shell: bash
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"
          URLS=(
            "https://cdn.jsdelivr.net/gh/suny820916/sagi-voice-edge-relay@$SHA/beta-site/index.html"
            "https://raw.githack.com/suny820916/sagi-voice-edge-relay/$SHA/beta-site/index.html"
            "https://rawcdn.githack.com/suny820916/sagi-voice-edge-relay/$SHA/beta-site/index.html"
          )
          for U in "${URLS[@]}"; do
            echo "=== $U ==="
            CODE="$(curl -L --silent --show-error --max-time 30 -D /tmp/h -o /tmp/b -w '%{http_code}' "$U" || true)"
            echo "status=$CODE"
            grep -Ei '^(content-type|content-disposition|access-control-allow-origin|cache-control|location):' /tmp/h || true
            python3 - <<'PY'
          import pathlib
          p=pathlib.Path('/tmp/b')
          print('bytes=',p.stat().st_size if p.exists() else 0)
          if p.exists():
              print(p.read_text(errors='replace')[:80].replace('\n',' '))
          PY
          done
