name: SAGI VOICE Relay Live Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/relay-live-test.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe workers.dev health
        run: |
          set -euo pipefail
          URL="https://sagi-voice-edge-relay.sg3544225.workers.dev/health"
          echo "Probing $URL"
          BODY="$(curl --fail --show-error --silent --retry 3 --connect-timeout 15 --max-time 45 "$URL")"
          echo "$BODY"
          python - <<'PY' <<<"$BODY"
          import json,sys
          d=json.load(sys.stdin)
          assert d.get("version") == "3.9.8", d
          assert d.get("aiVoice") is True, d
          assert d.get("voicePro") is True, d
          print("SAGI VOICE relay health verified.")
          PY
