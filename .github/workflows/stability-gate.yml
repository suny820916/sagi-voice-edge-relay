name: SAGI VOICE Source Gate

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

concurrency:
  group: sagi-voice-source-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify Sec-MS-GEC v2 vectors
        run: |
          node --input-type=module <<'JS'
          import { generateSecMsGec } from './edge-tts-direct.js';
          const vectors = [
            [0,'52BC7A17B50DFEC9-28C4394775C8751CD2F6859C030C06DB1489ACAB3B3A7651831FC26895177ED6'],
            [1760000000,'6D50DDDB91812C33-DD68EFB01898B0750C9797D51A5FF93471DFDAE6888A1039D532CBDCCE54545D'],
            [1760000300,'BAF4076F572BFE4E-2D6FBE5C0E24F56622EB94F37395F2D153C6C0C451DAAE2249A459BB3AFAD62C']
          ];
          for (const [t, expected] of vectors) {
            const got=generateSecMsGec(t);
            if(got!==expected) throw new Error('GEC mismatch '+t+' '+got);
            console.log('GEC OK', t);
          }
          JS

      - name: Verify dual-voice commentary
        run: node --test tests/edge-commentary.test.mjs

      - name: Wrangler dry-run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Stability policy check
        run: |
          test -f STABILITY.md
          test -f stability/golden-cases.json
          test -f stability/stable-baseline.json
          node -e "const x=require('./stability/golden-cases.json'); if(!Array.isArray(x.cases)||x.cases.length<7) process.exit(1); console.log('golden cases',x.cases.length)"
