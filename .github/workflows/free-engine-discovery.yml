name: Free TTS engine discovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sagi-free-live-discovery
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public endpoint contracts
        run: |
          pip install gradio_client
          python - <<'PY'
          from gradio_client import Client
          from huggingface_hub import HfApi
          for name in ['IndexTTS','CosyVoice','Kokoro']:
              for s in HfApi().list_spaces(search=name,limit=8):
                  print('DISCOVERED',s.id,flush=True)
          import json
          for space in ["IndexTeam/IndexTTS-2.5-Demo","IndexTeam/IndexTTS-2-Demo","Qwen/Qwen3-TTS","FunAudioLLM/CosyVoice2-0.5B"]:
              print("SPACE",space,flush=True)
              try:
                  c=Client(space,verbose=False)
                  print(json.dumps(c.view_api(return_format="dict"),ensure_ascii=False,default=str)[:24000],flush=True)
              except Exception as e:
                  print(type(e).__name__,str(e)[:500],flush=True)
          PY
      - name: Actual Edge fallback audio smoke
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install edge-tts
          timeout 60 edge-tts --voice zh-CN-YunxiNeural --text "机会来了！球进了！塔城队完成绝杀！" --write-media edge-test.mp3
          ffprobe -v error -show_entries format=duration,size -of json edge-test.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: SAGI-FREE-EDGE-SMOKE
          path: edge-test.mp3
