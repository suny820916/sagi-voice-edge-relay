          if [ "${PROMOTED:-0}" = "1" ] && [ -n "${MAIN_BEFORE:-}" ] && [ -n "${CANDIDATE:-}" ]; then
            echo "Post-promotion verification failed. Restoring previous main."
            git fetch origin main
            CURRENT="$(git rev-parse origin/main)"
            if [ "$CURRENT" = "$CANDIDATE" ]; then
              git push origin "$MAIN_BEFORE:refs/heads/main" --force-with-lease="refs/heads/main:$CANDIDATE"
              echo "Rollback complete: $MAIN_BEFORE"
            else
              echo "Main changed after promotion; refusing automatic rollback."
            fi
          else
            echo "Failure occurred before production promotion; no rollback needed."
          fi

