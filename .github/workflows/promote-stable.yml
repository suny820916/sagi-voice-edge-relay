              duration=0.0
              if status==200 and len(body)>1000:
                  q=subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(p)],capture_output=True,text=True)
                  duration=float((q.stdout or "0").strip() or 0)
              b=base_cases.get(case["id"],{})
              bdur=float(b.get("duration_seconds") or 0)
              bbytes=float(b.get("bytes") or 0)
              checks={
                  "http":status==200,
                  "router":headers.get("x-sagi-voice-router")=="1",
                  "route":headers.get("x-sagi-voice-route") in ("edge-direct","render-fallback"),
                  "complete":headers.get("x-sagi-voice-complete")=="1",
