          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$MAIN_BEFORE"
          CURRENT_BETA="$(git rev-parse origin/beta)"
          test "$CURRENT_BETA" = "$CANDIDATE"
          git push origin "$CURRENT_MAIN:refs/heads/stable-prev" --force
