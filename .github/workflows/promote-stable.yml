            if curl --silent --fail http://127.0.0.1:8787/ | grep -q '独立长期入口 · Stable Router · R3.3'; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat /tmp/sagi-candidate.log; exit 1; fi

      - name: Seven-case candidate golden gate
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y ffmpeg
          fi
