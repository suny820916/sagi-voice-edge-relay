        if: always()
        run: |
          {
            echo "# SAGI VOICE Promotion"
            echo ""
            echo "- Previous main: `${MAIN_BEFORE:-not-promoted}`"
            echo "- Candidate: `${CANDIDATE:-not-created}`"
            echo "- Promoted: `${PROMOTED:-0}`"
            echo "- Production URL: https://sagi-voice-edge-relay.sg3544225.workers.dev/"
          } >> "$GITHUB_STEP_SUMMARY"
