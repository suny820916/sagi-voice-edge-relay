name: Free mobile UI
on:
  workflow_call:
  push:
    branches: [feature/free-engine-discovery, feature/voice-v1.7-director]
  pull_request:
    branches: [main]
    paths: ['free-mobile/**', 'free-engine-router.mjs', 'free-provider-adapters.mjs', '.github/workflows/free-mobile-test.yml']
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    permissions:
      contents: read
    env:
      TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --test tests/football-director.test.mjs tests/director-audio.test.mjs
          cp free-engine-router.mjs free-provider-adapters.mjs free-mobile/
          npm install --no-save playwright
          npx playwright install --with-deps "$TEST_ENGINE"
          python3 -m http.server 8765 --directory free-mobile > /tmp/free-http.log 2>&1 &
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          import assert from 'node:assert/strict';
          const browser=await ({chromium,webkit}[process.env.TEST_ENGINE]).launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'});
            await page.addInitScript(()=>Object.defineProperty(navigator,'canShare',{value:()=>false}));
            const wav=Buffer.alloc(44+48000*2);
            wav.write('RIFF',0);wav.writeUInt32LE(wav.length-8,4);wav.write('WAVEfmt ',8);
            wav.writeUInt32LE(16,16);wav.writeUInt16LE(1,20);wav.writeUInt16LE(1,22);
            wav.writeUInt32LE(16000,24);wav.writeUInt32LE(32000,28);wav.writeUInt16LE(2,32);wav.writeUInt16LE(16,34);
            wav.write('data',36);wav.writeUInt32LE(96000,40);
            for(let i=0;i<48000;i++)wav.writeInt16LE(Math.round(4000*Math.sin(i*.17)),44+i*2);
            const cors={'access-control-allow-origin':'*','access-control-allow-methods':'POST, GET, OPTIONS','access-control-allow-headers':'content-type, accept'};
            const reply=(r,status,extra={})=>r.fulfill(r.request().method()==='OPTIONS'?{status:204,headers:cors}:{status,headers:cors,...extra});
            page.on('pageerror',e=>console.log('pageerror',e.message));
            page.on('requestfailed',r=>console.log('requestfailed',r.method(),r.url(),r.failure()?.errorText));
            await page.route('https://qwen-qwen3-tts.hf.space/**',r=>reply(r,503));
            await page.route('https://indexteam-indextts-2-5-demo.hf.space/**',r=>reply(r,503));
            await page.route('https://sagi-voice-edge-relay.sg3544225.workers.dev/**',r=>reply(r,200,{contentType:'audio/wav',body:wav}));
            await page.goto('http://127.0.0.1:8765/');
            await page.locator('#text').fill('塔城队进球了！');
            assert.equal(await page.locator('#useLearned').isChecked(),true);
            assert.equal(await page.locator('#consent').isDisabled(),true);
            await page.locator('summary').click();
            const directedRequests=[];
            page.on('request',r=>{
              if(r.method()==='POST'&&r.url().endsWith('/api/direct-tts'))directedRequests.push(r.postDataJSON());
            });
            const directedText='开场两分钟。赵松源前场抢断。左脚低射。球进了！这是属于中国队的世界杯进球。';
            await page.locator('#text').fill(directedText);
            await page.locator('#generate').click();
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled);
            assert.equal(directedRequests.length,5);
            assert.equal(directedRequests.map(r=>r.text).join(''),directedText);
            assert.equal(directedRequests[3].style,'football_goal');
            assert.ok(directedRequests[3].intensity>directedRequests[4].intensity);
            assert.equal(await page.locator('#save').isEnabled(),true);
            await page.locator('#regenerateSegment').selectOption('3');
            const initialAudio=await page.locator('#audio').getAttribute('src');
            const requestCount=directedRequests.length;
            await page.locator('#regeneratePart').click();
            await page.waitForFunction(()=>!document.querySelector('#regeneratePart').disabled);
            assert.equal(directedRequests.length,requestCount+1);
            assert.equal(directedRequests.at(-1).text,'球进了！');
            const regeneratedAudio=await page.locator('#audio').getAttribute('src');
            assert.notEqual(regeneratedAudio,initialAudio);
            await page.route('**/api/direct-tts',r=>reply(r,503));
            await page.locator('#regeneratePart').click();
            await page.waitForFunction(()=>!document.querySelector('#regeneratePart').disabled);
            assert.equal(await page.locator('#audio').getAttribute('src'),regeneratedAudio);
            assert.equal(await page.locator('#save').isEnabled(),true);
            await page.unroute('**/api/direct-tts');
            const download=page.waitForEvent('download');
            await page.locator('#save').click();
            assert.equal((await download).suggestedFilename(),'SAGI_VOICE.wav');
            await page.locator('#ab').check();
            await page.locator('#text').fill('开场两分钟。球进了！');
            await page.locator('#generate').click();
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled);
            await page.locator('#playB').click();
            assert.equal(await page.evaluate(()=>localStorage.getItem('sagi-director-preference-ai_male')),null);
            await page.locator('#preferB').click();
            assert.equal(await page.evaluate(()=>JSON.parse(localStorage.getItem('sagi-director-preference-ai_male'))),'B');
            await page.locator('#ab').uncheck();
            await page.locator('#director').uncheck();
            await page.locator('#text').fill('塔城队进球了！');
            const autoRequests=[];
            page.on('request',r=>{
              if(r.method()==='POST'&&r.url().endsWith('/api/direct-tts'))autoRequests.push(r.postDataJSON());
            });
            await page.locator('#generate').click();
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled);
            assert.deepEqual(autoRequests.map(r=>r.speed),[.9,1]);
            assert.match(await page.locator('#status').textContent(),/自学匹配/);
            assert.ok(await page.evaluate(()=>localStorage.getItem('sagi-auto-learning-v1-ai_male')));
            await page.locator('#useLearned').uncheck();
            await page.locator('#consent').check();
            await page.locator('#generate').click();
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled);
            assert.match(await page.locator('#status').textContent(),/已自动切换：Edge TTS/);
            assert.equal(await page.locator('#save').isEnabled(),true);
            // Regression: failed generation must not expose the preceding audio.
            await page.locator('#mode').selectOption('ai_female');
            assert.equal(await page.locator('#consent').isDisabled(),true);
            const femaleRequest=page.waitForRequest(r=>r.method()==='POST'&&r.url().endsWith('/api/direct-tts'));
            await page.locator('#generate').click();
            assert.equal((await femaleRequest).postDataJSON().mode,'ai_female');
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled);
            assert.equal(await page.locator('#save').isEnabled(),true);
            await page.locator('#mode').selectOption('ai_male');
            await page.unroute('https://sagi-voice-edge-relay.sg3544225.workers.dev/**');
            await page.route('https://sagi-voice-edge-relay.sg3544225.workers.dev/**',r=>reply(r,503));
            await page.locator('#consent').uncheck();
            await page.locator('#generate').click();
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled);
            assert.equal(await page.locator('#save').isEnabled(),false);
            assert.equal(await page.locator('#audio').isVisible(),false);
            assert.equal(await page.locator('#text').inputValue(),'塔城队进球了！');
            await page.reload();
            await page.locator('summary').click();
            await page.locator('#director').uncheck();
            assert.equal(await page.locator('#text').inputValue(),'塔城队进球了！');
            await page.locator('#useLearned').uncheck();
            await page.unroute('https://sagi-voice-edge-relay.sg3544225.workers.dev/**');
            await page.route('https://sagi-voice-edge-relay.sg3544225.workers.dev/**',r=>reply(r,200,{contentType:'audio/wav',body:wav}));
            const longText='足球解说稿'.repeat(120);
            await page.locator('#text').fill(longText);
            const longRequest=page.waitForRequest(r=>r.method()==='POST'&&r.url().endsWith('/api/direct-tts'));
            await page.locator('#generate').click();
            assert.equal((await longRequest).postDataJSON().text,longText);
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled);
            assert.equal(await page.locator('#save').isEnabled(),true);
            const tooLong=longText+'球';
            await page.locator('#text').fill(tooLong);
            await page.locator('#generate').click();
            assert.match(await page.locator('#status').textContent(),/600/);
            assert.equal(await page.locator('#text').inputValue(),tooLong);
            await page.locator('#text').fill('开场两分钟。球进了！');
            await page.unroute('https://sagi-voice-edge-relay.sg3544225.workers.dev/**');
            await page.route('https://sagi-voice-edge-relay.sg3544225.workers.dev/**',async r=>{
              if(r.request().method()==='OPTIONS')return reply(r,204);
              await new Promise(resolve=>setTimeout(resolve,1000));
              await reply(r,200,{contentType:'audio/wav',body:wav}).catch(()=>{});
            });
            const pending=page.waitForRequest(r=>r.method()==='POST'&&r.url().endsWith('/api/direct-tts'));
            await page.locator('#generate').click();
            await pending;
            await page.locator('#cancel').click();
            await page.waitForFunction(()=>!document.querySelector('#generate').disabled);
            assert.match(await page.locator('#status').textContent(),/已取消|abort/i);
            assert.equal(await page.locator('#save').isEnabled(),false);
            console.log('Browser mock fallback, decode, draft persistence and long input passed');
          }finally{await browser.close()}
          JS
          if [ "$TEST_ENGINE" = chromium ]; then
            node tests/director-live-smoke.mjs
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SAGI-VOICE-FREE-MOBILE-TEST-${{ matrix.engine }}
          path: free-mobile/
