</style><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./icon.svg"></head><body><main><h1>SAGI VOICE<i>●</i></h1><p>FREE V1.6 · 独立测试版</p><textarea id="text" maxlength="240" placeholder="输入足球解说文案"></textarea><small>每次最多240字，不自动截断。</small><label>解说风格<select id="style"><option value="goal">高燃绝杀</option><option value="pro">职业解说</option><option value="warm">温情纪录片</option></select></label><label><input type="checkbox" id="consent"> 允许将文案发送给 Qwen 和 IndexTTS 公开试玩服务（可能排队或不可用），否则使用 Edge。</label><label>目标时长（仅用于对比，暂不改变音频）<select id="target"><option value="0">自然时长</option><option value="10">10秒</option><option value="15">15秒</option><option value="20">20秒</option><option value="30">30秒</option><option value="45">45秒</option><option value="60">60秒</option></select></label><button class="primary" id="generate">生成配音</button><button id="cancel" disabled>取消</button><p id="status" role="status" aria-live="polite">等待生成</p><audio id="audio" controls playsinline hidden></audio><button id="save" disabled>保存音频</button><p><small>本版使用自然时长。公开服务不保证可用，勿输入敏感数据。Edge 仅在授权来源可用。</small></p><button id="update" hidden>更新版本</button></main><script type="module">
import {generateFree} from './free-engine-router.mjs';
import {makeProviders,validateBrowserAudio} from './free-provider-adapters.mjs';

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(reg=>{const show=()=>{if(reg.waiting){$('update').hidden=false;$('update').onclick=()=>{if(controller)return;reg.waiting?.postMessage('UPDATE')}}};show();reg.addEventListener('updatefound',()=>reg.installing?.addEventListener('statechange',show));let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!$('update').hidden&&!reloading){reloading=true;location.reload()}});}).catch(()=>{})}
try{$('text').value=localStorage.getItem('sagi-free-draft')||''}catch{}
$('text').addEventListener('input',()=>{try{localStorage.setItem('sagi-free-draft',$('text').value)}catch{}});
$('cancel').onclick=()=>controller?.abort();
$('generate').onclick=async()=>{
 const text=$('text').value.trim();if(!text||text.length>240){$('status').textContent='请输入1至240字';return}
 controller=new AbortController();$('generate').disabled=true;$('cancel').disabled=false;$('status').textContent='准备生成';
 const target=Number($('target').value);const style=$('style').value;const instructions={goal:'职业足球直播解说，逐渐蓄力，进球瞬间爆发，随后自然收束。',pro:'职业足球解说，清晰自然，节奏富有变化。',warm:'温情足球纪录片，克制真诚，留有余韵。'};
 try{
 const result=await generateFree({text,style,instruction:instructions[style]+'准确朗读，不增字漏字。'},makeProviders(),{signal:controller.signal,allowPublicDemo:$('consent').checked,validateAudio:validateBrowserAudio,onStatus:engine=>$('status').textContent='正在尝试 '+engine});
 if(url)URL.revokeObjectURL(url);blob=result.audio;url=URL.createObjectURL(blob);$('audio').src=url;$('audio').hidden=false;$('save').disabled=false;$('status').textContent=(result.fallback?'已自动切换：':'生成完成：')+result.engine+' · '+(result.durationSeconds?.toFixed(2)??'未知')+'秒'+(target&&result.durationSeconds?'（目标 '+target+'秒，偏差 '+(result.durationSeconds-target).toFixed(2)+'秒）':'');$('audio').play().catch(()=>{});
 }catch(e){$('status').textContent=e.message+'。文案仍保留。'}finally{$('generate').disabled=false;$('cancel').disabled=true;controller=null}
};
$('save').onclick=async()=>{if(!blob)return;const ext=blob.type.includes('mpeg')?'mp3':'wav';const file=new File([blob],'SAGI_VOICE.'+ext,{type:blob.type});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=url;a.download=file.name;a.click()};
</script></body></html>
