<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101310"><title>SAGI VOICE FREE V1.7 DIRECTOR</title><style>
*{box-sizing:border-box}body{background:#101310;color:#fff;font:16px system-ui,sans-serif;margin:0;padding:calc(22px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom))}main{max-width:580px;margin:auto}h1{font-size:25px}i{color:#ef3939}p,small{color:#b4b8ae}textarea,select,button{font:inherit;border-radius:12px;padding:13px;border:1px solid #575c50;background:#1b201a;color:#fff}textarea,select,audio{width:100%}textarea{min-height:190px;resize:vertical}button{min-height:48px;margin:8px 4px 8px 0}button.primary{background:#e4ca87;color:#121611;font-weight:700}button:disabled{opacity:.45}label{display:block;margin:12px 0}#status{min-height:48px;overflow-wrap:anywhere}a{color:#e4ca87}audio{margin-top:12px}
</style><link rel="manifest" href="./manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./icon.svg"></head><body><main><h1>SAGI VOICE<i>●</i></h1><p>FREE V1.7 DIRECTOR · 独立测试版</p><textarea id="text" placeholder="输入足球解说文案"></textarea><small>每次最多 600 字，超出时保留原稿。长稿生成可能需要更久。</small><label>解说声线<select id="mode"><option value="ai_male">男声 · 沉稳浑厚</option><option value="ai_female">女声 · 成熟温暖</option></select></label><details><summary>专业设置</summary><label><input id="director" type="checkbox" checked> 逐句足球导演</label><label><input id="ab" type="checkbox"> A/B 试听实验</label><div id="choices" hidden><button id="playA" type="button">试听 A</button><button id="playB" type="button">试听 B</button><button id="preferA" type="button">更喜欢 A</button><button id="preferB" type="button">更喜欢 B</button></div><button id="inspectPlan" type="button">查看导演计划</button><pre id="plan" hidden></pre><section id="learning"><label><input id="useLearned" type="checkbox" checked> 自动学习（智能足球模式）</label><small id="learningStatus" role="status"></small></section><label>解说风格<select id="style"><option value="football_auto" selected>智能足球情绪导演（自然蓄力）</option><option value="football_pro">沉稳专业</option><option value="football_goal">关键时刻高燃</option><option value="football_warm">温情纪录片</option></select></label><label><input type="checkbox" id="consent"> 男声可选：允许将文案发送给 Qwen 和 IndexTTS 公开试玩服务（可能排队或不可用），否则使用 Edge。</label></details><label>目标时长<select id="target"><option value="0">自然时长</option><option value="10">10秒</option><option value="15">15秒</option><option value="20">20秒</option><option value="30">30秒</option><option value="45">45秒</option><option value="60">60秒</option></select></label><button class="primary" id="generate">生成配音</button><button id="cancel" disabled>取消</button><p id="status" role="status" aria-live="polite">等待生成</p><audio id="audio" controls playsinline hidden></audio><button id="save" disabled>保存音频</button><p><small>逐句模式支持目标时长校准。公开服务不保证可用，勿输入敏感数据。Edge 仅在授权来源可用。</small></p><button id="update" hidden>更新版本</button></main><script type="module">
import {learnReference,referenceDistance,builtInReference,adaptiveReference,recordReferenceResult} from './reference-style.mjs';
import {planFootball,estimateDuration} from './football-director.mjs';
import {renderDirector} from './director-audio.mjs';
import {generateFree} from './free-engine-router.mjs';
import {makeProviders,validateBrowserAudio} from './free-provider-adapters.mjs';
const $=id=>document.getElementById(id);let controller,blob,url,experiment;
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(reg=>{const show=()=>{if(reg.waiting){$('update').hidden=false;$('update').disabled=!!controller;$('update').onclick=()=>{if(controller)return;reg.waiting?.postMessage('UPDATE')}}};show();reg.addEventListener('updatefound',()=>reg.installing?.addEventListener('statechange',show));let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!$('update').hidden&&!reloading&&!controller){reloading=true;location.reload()}});}).catch(()=>{})}
try{$('text').value=localStorage.getItem('sagi-free-draft')||''}catch{}
$('text').addEventListener('input',()=>{try{localStorage.setItem('sagi-free-draft',$('text').value)}catch{}});
const profileKey = mode => 'sagi-reference-style-v1-' + mode;
const historyKey = mode => 'sagi-auto-learning-v1-' + mode;
function readLocal(key){
 try{return JSON.parse(localStorage.getItem(key))}catch{return null}
}
function referenceFor(mode){
 const saved=readLocal(profileKey(mode));
 return saved && saved.count>0 && ['speed','intensity','pauseRatio'].every(key=>Number.isFinite(saved[key])) ? saved : builtInReference;
}
function updateLearning(){
 const available=$('style').value==='football_auto';
 $('useLearned').disabled=!available;
 const active=available&&$('useLearned').checked;
 $('consent').disabled=active||$('mode').value==='ai_female';
 $('learningStatus').textContent=active?'已开启 · 使用本机解说偏好':'关闭 · 使用原版参数';
}
$('mode').onchange=$('style').onchange=$('useLearned').onchange=updateLearning;
$('mode').onchange();
$('inspectPlan').onclick=()=>{
 const plan=planFootball($('text').value.trim());
 $('plan').textContent=plan.length ? JSON.stringify({estimatedSeconds:Math.round(estimateDuration(plan)),segments:plan},null,2) : '请先输入解说词';
 $('plan').hidden=false;
};
$('cancel').onclick=()=>controller?.abort();
$('generate').onclick=async()=>{
 const text=$('text').value.trim();if(!text||text.length>600){$('status').textContent='请输入 1 至 600 字';return}
 experiment=null;$('choices').hidden=true;
 controller=new AbortController();$('update').disabled=true;$('audio').pause();$('audio').removeAttribute('src');$('audio').load();$('audio').hidden=true;$('save').disabled=true;if(url)URL.revokeObjectURL(url);url=null;blob=null;$('generate').disabled=true;$('cancel').disabled=false;$('status').textContent='准备生成';
 const mode=$('mode').value;const reference=$('useLearned').checked && $('style').value==='football_auto' ? referenceFor(mode) : undefined;const history=readLocal(historyKey(mode));const preference=readLocal('sagi-director-preference-'+mode);const profile=reference && preference!=='A' ? adaptiveReference(reference,preference==='B'?null:history) : undefined;const target=Number($('target').value);const style=$('style').value;const instructions={football_auto:'成熟、浑厚、有磁性的男性体育解说。真实自然，平时克制清晰；进球、绝杀、反超等关键瞬间才明显爆发，之后自然收束。',football_pro:'成熟浑厚的男性职业足球解说，沉稳、清晰、自然，不夸张。',football_goal:'成熟浑厚的男性足球解说，前段自然蓄力，关键进球瞬间爆发，随后收束。',football_warm:'成熟浑厚的男性纪录片旁白，温暖、克制、真诚，留有余韵。'};
 try{
 const request={text,style,mode,profile,instruction:instructions[style]+'准确朗读，不增字漏字。'};
 const options={signal:controller.signal,allowPublicDemo:!profile&&mode==='ai_male'&&$('consent').checked,validateAudio:validateBrowserAudio,onStatus:engine=>$('status').textContent='正在尝试 '+engine};
 const providers=makeProviders();
 const useDirector=$('director').checked&&style==='football_auto';
 const plan=useDirector?planFootball(text):[];
 let result,comparison='';
 if(plan.length&&plan.length<=8){
  try{
   const edge=providers.filter(provider=>!provider.publicDemo);
   const experimentEnabled=$('ab').checked;
   const render=(variant,calibrate)=>renderDirector(plan,item=>generateFree({
    ...request,text:item.text,style:item.style,
    profile:{speed:item.speed,intensity:item.intensity}
   },edge,{...options,onStatus:undefined}),{
    signal:controller.signal,target,profile:variant,calibrate,
    onProgress:(index,total)=>$('status').textContent='逐句生成 '+index+'/'+total
   });
   result=await render(experimentEnabled?undefined:profile,!experimentEnabled);
   if(experimentEnabled){
    try{
     const learned=await render(adaptiveReference(referenceFor(mode),history),false);
     experiment={mode,A:result,B:learned};
     $('choices').hidden=false;
    }catch(e){if(controller.signal.aborted)throw e;comparison=' · B 未生成，保留 A';}
   }
  }catch(e){
   if(controller.signal.aborted)throw e;
   comparison=' · 逐句生成失败，已切换完整生成';
  }
 }else if(plan.length>8)comparison=' · 长稿使用完整生成';
 const compare=Boolean(profile)&&!useDirector;
 if(!result)result=await generateFree(request,providers,options);
 if(result.parts){
  const event={mode,engine:result.engine,style,duration:result.durationSeconds,learned:Boolean(profile),
   segments:result.parts.map(part=>part.settings).map(({type,speed,intensity,pauseBefore,pauseAfter,style})=>({type,speed,intensity,pauseBefore,pauseAfter,style}))};
  try{localStorage.setItem('sagi-director-history',JSON.stringify([...(readLocal('sagi-director-history')||[]).slice(-19),event]))}catch{}
 }
 if(compare){
  let ctx;
  try{
   const baseline=await generateFree({...request,profile:undefined},providers,options);
   const AC=window.AudioContext||window.webkitAudioContext;
   ctx=new AC();
   const score=async candidate=>{
    const decoded=await ctx.decodeAudioData(await candidate.audio.arrayBuffer());
    return referenceDistance(learnReference(decoded.getChannelData(0),decoded.sampleRate,text,240),reference);
   };
   const [baseScore,learnedScore]=await Promise.all([score(baseline),score(result)]);
   if(controller.signal.aborted)throw new Error('已取消');
   const learnedWon=learnedScore<baseScore;
   try{localStorage.setItem(historyKey(mode),JSON.stringify(recordReferenceResult(history,learnedWon)))}catch{}
   if(!learnedWon){result=baseline;comparison=' · 自学匹配：原版'}
   else comparison=' · 自学匹配：学习版';
  }catch(e){
   if(controller.signal.aborted)throw e;
   comparison=' · 本次无法完成自动比较';
  }finally{if(ctx)await ctx.close().catch(()=>{})}
 }
 if(controller.signal.aborted)throw new Error('已取消');
 if(url)URL.revokeObjectURL(url);blob=result.audio;url=URL.createObjectURL(blob);$('audio').src=url;$('audio').hidden=false;$('save').disabled=false;$('status').textContent=(result.fallback?'已自动切换：':'生成完成：')+result.engine+' · '+(result.durationSeconds?.toFixed(2)??'未知')+'秒'+(target&&result.durationSeconds?'（目标 '+target+'秒，偏差 '+(result.durationSeconds-target).toFixed(2)+'秒）':'')+comparison;$('audio').play().catch(()=>{if(blob && !controller?.signal.aborted) $('status').textContent+=' · 请点击播放器播放（浏览器限制自动播放）';});
 }catch(e){$('status').textContent=e.message+'。文案仍保留。'}finally{$('generate').disabled=false;$('cancel').disabled=true;controller=null;$('update').disabled=false}
};
function selectExperiment(label,remember){
 if(!experiment||controller)return;
 const {mode}=experiment;
 const selection=experiment[label];
 if(remember)try{
  localStorage.setItem('sagi-director-preference-'+mode,JSON.stringify(label));
  const history=readLocal('sagi-director-history')||[];
  if(history.length){
   history[history.length-1].preference=label;
   history[history.length-1].duration=selection.durationSeconds;
   history[history.length-1].learned=label==='B';
   history[history.length-1].segments=selection.parts.map(({settings})=>{
    const {type,speed,intensity,pauseBefore,pauseAfter,style}=settings;
    return {type,speed,intensity,pauseBefore,pauseAfter,style};
   });
   localStorage.setItem('sagi-director-history',JSON.stringify(history));
  }
 }catch{}
 if(url)URL.revokeObjectURL(url);
 blob=selection.audio;url=URL.createObjectURL(blob);
 $('audio').src=url;
 $('audio').play().catch(()=>{});
 $('status').textContent=(remember?'已选择 ':'试听 ')+label+' · '+selection.durationSeconds.toFixed(2)+' 秒';
}
$('playA').onclick=()=>selectExperiment('A',false);
$('playB').onclick=()=>selectExperiment('B',false);
$('preferA').onclick=()=>selectExperiment('A',true);
$('preferB').onclick=()=>selectExperiment('B',true);
$('save').onclick=async()=>{if(!blob)return;const mime=blob.type.split(';')[0].toLowerCase();const ext=({'audio/mpeg':'mp3','audio/mp3':'mp3','audio/wav':'wav','audio/x-wav':'wav','audio/ogg':'ogg','audio/webm':'webm','audio/mp4':'m4a','audio/aac':'aac','audio/flac':'flac'})[mime]||'bin';const file=new File([blob],'SAGI_VOICE.'+ext,{type:blob.type});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=url;a.download=file.name;a.click()};
</script></body></html>
